# ============================================
#  结构化WebSearch情报收集模板 v1.0
#  基于 维京2-1 / 博德1-2 100%命中验证的方法论固化
# ============================================
#
# 使用方法：
#   在分析每场比赛时，按顺序执行以下12个搜索词
#   将结果填入标准JSON格式，供铁律引擎读取
#
# 对应铁律六层SOP：
#   Layer 1 (词1-4):   球队基础 + 伤停 + 阵容
#   Layer 2 (词5-6):   H2H交锋 + 历史赔率
#   Layer 3 (词7-8):   实时赔率 + 亚盘变动
#   Layer 4 (词9):     PFI疲劳度（赛程密集度）
#   Layer 5 (词10):    天气条件
#   Layer 6 (词11-12): 新闻动因 + 首发曝光
#
# ============================================

search_templates:
  # ===== Layer 1: 球队基础 + 伤停 + 阵容 =====
  - id: 1
    layer: 1
    category: injuries
    search_term_template: "{home} injuries news today {date}"
    fallback_term_template: "{home} 伤停名单 {date_cn}"
    target_data:
      - missing_player_name
      - position (GK/DF/MF/FW)
      - reason (injury/suspended/red_card/tired)
      - expected_return
    priority: critical
    iron_rules: ["#5 伤停精确到人", "#19 核心缺阵降星"]
    notes: "必须区分「确认缺阵」vs「出战存疑」"

  - id: 2
    layer: 1
    category: injuries
    search_term_template: "{away} injuries news today {date}"
    fallback_term_template: "{away} 伤停名单 {date_cn}"
    target_data:
      - missing_player_name
      - position
      - reason
      - expected_return
    priority: critical
    iron_rules: ["#5", "#19"]

  - id: 3
    layer: 1
    category: lineup
    search_term_template: "{home} predicted lineup vs {away} {date}"
    fallback_term_template: "{home} 首发 预测 {date_cn}"
    target_data:
      - starting_11_names
      - formation (4-3-3/4-2-3-1/etc)
      - changes_from_last_match
    priority: high
    iron_rules: ["#29 首发曝光-轮换识别"]
    notes: "T-3h内的首发消息=黄金情报（规则#29）"

  - id: 4
    layer: 1
    category: lineup
    search_term_template: "{away} predicted lineup vs {home} {date}"
    fallback_term_template: "{away} 首发 预测 {date_cn}"
    target_data:
      - starting_11_names
      - formation
      - changes_from_last_match
    priority: high
    iron_rules: ["#29"]

  # ===== Layer 2: H2H交锋 + 历史赔率 =====
  - id: 5
    layer: 2
    category: h2h
    search_term_template: "{home} vs {away} head to head statistics"
    fallback_term_template: "{home} {away} 交锋记录 历史战绩"
    target_data:
      - last_10_matches_results (WWDDL format)
      - home_win_rate_pct
      - avg_goals_per_match
      - dominant_trend (home/away/balanced)
    priority: critical
    iron_rules: ["#26 H2H逆向思维", "#14 H2H一边倒"]
    notes: "重点看最近5场趋势，不只看总战绩"

  - id: 6
    layer: 2
    category: h2h_odds
    search_term_template: "{home} vs {away} historical odds results"
    fallback_term_template: "{home} {away} 历史赔率 走势"
    target_data:
      - last_3_odds_movement_direction
      - bookmaker_adjustment_pattern
      - upset_frequency
    priority: medium
    iron_rules: ["#25 赔率异动捕捉"]
    notes: "对比历史同期赔率，发现异常偏移"

  # ===== Layer 3: 实时赔率 + 亚盘变动 =====
  - id: 7
    layer: 3
    category: odds_live
    search_term_template: "{home} vs {away} odds today betting analysis"
    fallback_term_template: "{home} {away} 赔率 分析 今日"
    target_data:
      - home_win_odds (decimal)
      - draw_odds
      - away_win_odds
      - asian_handicap (opening/current)
      - total_goals_line
    priority: critical
    iron_rules: ["#25 赔率异动", "#27 亚盘降盘联动", "#13 DOIT三角"]
    notes: "至少对比3家bookmaker，单家异常≠市场信号"

  - id: 8
    layer: 3
    category: asian_handicap
    search_term_template: "{home} vs {away} asian handicap movement today"
    fallback_term_template: "{home} {away} 亚盘 变动 盘口"
    target_data:
      - opening_handicap
      - current_handicap
      - change_magnitude (balls)
      - bookmakers_with_change (count/total)
      - change_direction (up/down)
    priority: critical
    iron_rules: ["#27 亚盘降盘-信心联动"]
    notes: "≥0.25球变动且≥4/5家bookmaker同步 = 强信号（规则#27）"

  # ===== Layer 4: PFI疲劳度 =====
  - id: 9
    layer: 4
    category: pfi
    search_term_template: "{home} fixture congestion fatigue {match_month} {match_year}"
    fallback_term_template: "{home} 赛程 密集 疲劳 {date_cn}"
    target_data:
      - matches_in_last_7_days
      - matches_in_last_14_days
      - last_match_competition (league/ucl/uel/cup)
      - rest_days_since_last_match
      - any_midweek_fixture
    priority: high
    iron_rules: ["#17 PFI四项检测", "#28 PFI比分区间收缩"]
    notes: "重点查7天内是否有杯赛/欧战夹击"

  - id: 10
    layer: 4
    category: pfi
    search_term_template: "{away} fixture congestion fatigue {match_month} {match_year}"
    fallback_term_template: "{away} 赛程 密集 疲劳 {date_cn}"
    target_data:
      - matches_in_last_7_days
      - last_match_competition
      - rest_days
      - travel_distance_km (if away last match)
    priority: high
    iron_rules: ["#17", "#28"]

  # ===== Layer 5: 天气条件 =====
  - id: 11
    layer: 5
    category: weather
    search_term_template: "{city} weather forecast {date} match day"
    fallback_term_template: "{city} 天气预报 {date_cn}"
    target_data:
      - temperature_celsius
      - precipitation_probability_pct
      - wind_speed_kmh
      - humidity_pct
      - weather_warning (storm/snow/extreme_heat)
    priority: medium
    iron_rules: ["#20 天气阈值"]
    notes: "风速>40km/h或降水>70%才触发规则#20"

  # ===== Layer 6: 新闻动因 + 首发曝光 =====
  - id: 12
    layer: 6
    category: news
    search_term_template: "{home} vs {away} team news motivation {date}"
    fallback_term_template: "{home} {away} 动态 新闻 {date_cn}"
    target_data:
      - manager_press_conference_quotes
      - player_interviews (key players only)
      - transfer_rumors_impact
      - table_stakes (relegation/europe race)
      - morale_indicators
    priority: high
    iron_rules: ["#21 战意等级", "#22 冷门诱因"]
    notes: "教练赛前发布会内容=高价值信号"

  - id: 13
    layer: 6
    category: lineup_leak
    search_term_template: "{home} lineup leak confirmed {date}"
    fallback_term_template: "{home} 首发曝光 确认 {date_cn}"
    target_data:
      - confirmed_starting_11
      - source_reliability (official/fan_leak/journalist)
      - time_before_kickoff (hours)
    priority: critical
    iron_rules: ["#29 首发曝光-轮换识别"]
    notes: "赛前3小时内的曝光消息可信度最高"

  - id: 14
    layer: 6
    category: lineup_leak
    search_term_template: "{away} lineup leak confirmed {date}"
    fallback_term_template: "{away} 首发曝光 确认 {date_cn}"
    target_data:
      - confirmed_starting_11
      - source_reliability
      - time_before_kickoff
    priority: critical
    iron_rules: ["#29"]

# ============================================
#  执行策略
# ============================================

execution_strategy:
  mode: "progressive"  # progressive | parallel
  rounds:
    - round_id: 1
      timing: "T-12h"  # 赛前12小时
      templates: [1, 2, 5, 9, 10]  # 基础数据先行
      purpose: "建立基线数据"

    - round_id: 2
      timing: "T-6h"  # 赛前6小时
      templates: [3, 4, 6, 7, 8, 11]  # 动态信号跟进
      purpose: "捕获赔率变动和阵容预测"

    - round_id: 3
      timing: "T-3h"  # 赛前3小时（黄金窗口）
      templates: [12, 13, 14, 7, 8]  # 最终校准
      purpose: "新闻/首发/临盘赔率最终确认"

  quality_thresholds:
    min_sources_for_high_confidence: 5
    min_sources_for_medium_confidence: 3
    cache_ttl_minutes: 15  # 同一搜索词缓存15分钟

# ============================================
#  输出格式规范
# ============================================

output_schema:
  type: "object"
  properties:
    match_metadata:
      home_team: string
      away_team: string
      league: string
      kickoff_time: ISO8601
      collected_at: ISO8601
      collection_round: [1, 2, 3]

    layer1_basic:
      injuries_home: InjuryRecord[]
      injuries_away: InjuryRecord[]
      lineup_home_predicted: string[]
      lineup_away_predicted: string[]
      formations: {home: string, away: string}

    layer2_h2h:
      last_10_results: H2HRecord[]
      home_win_rate: float
      dominant_trend: string
      historical_odds_pattern: string

    layer3_odds:
      odds_current: OddsData
      odds_24h_ago: OddsData  # 用于计算变动量
      asian_change_summary:
        magnitude: float
        direction: string
        bookmaker_consensus: string  # e.g., "4/5"

    layer4_pfi:
      pfi_home: PFIData
      pfi_away: PFIData
      fatigue_comparison: string  # "home_favoured" | "away_favoured" | "neutral"

    layer5_weather:
      weather: WeatherData
      impact_assessment: string  # "normal" | "caution" | "severe"

    layer6_news:
      headlines: string[]
      key_quotes: {source: string, quote: string, speaker: string}
      lineup_confirmations: {home: LineupConfirmation, away: LineupConfirmation}
      motivation_analysis: {home: MotivationData, away: MotivationData}

    quality_score:
      sources_count: int
      confidence_level: string  # "high" | "medium" | "low"
      missing_critical_data: string[]  # 未获取到的关键数据项列表
      recommendations: string[]  # 给分析引擎的建议
